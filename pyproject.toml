[project]
name = "vision-transformers-cifar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tymoteusz Lindner", email = "tymoteusz.lindner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lightning>=2.6.6",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyaml>=26.7.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "tensorboard>=2.21.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
